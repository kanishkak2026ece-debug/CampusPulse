<!DOCTYPE html>
<html>
    <head>
        <title>CampusPulse</title>
        <link rel="stylesheet"
        href="style.css">
    </head>
    <body>
        <header>
            <h1>CampusPulse</h1>
            <p>One Campus. Every Event. One Pass.</p>
        </header>

        <main>
            <h2>Upcoming College Events</h2>
            <div class="event">
                  <h3>Technical Symposium</h3>
                  <p>Date: 20 November 2026</p>
                  <p>Venue: College Auditorium</p>
                  <button 

                  <button
onclick="registerEvent('Technical Symposium', '20 November 2026', 'College Auditorium')">
Register Now
</button>
                <div class="event">
                    <h3>Cultural Fest</h3>
                    <p>Date: 25 November 2026</p>
                    <p>Venue: College Ground</p>
                    <button
onclick="registerEvent('Cultural Fest', '25 November 2026', 'College Ground')">
Register Now
</button>
                </div>
               
                <h2>Admin Event Creator</h2>

<div class="admin-form">
    <form onsubmit="addEvent(event)">

        <input
            type="text"
            id="eventName"
            placeholder="Enter event name"
            required
        >

        <input
            type="date"
            id="eventDate"
            required
        >

        <input
            type="text"
            id="eventVenue"
            placeholder="Enter event venue"
            required
        >

        <textarea
            id="eventDescription"
            placeholder="Enter event description"
            required
        ></textarea>

        <button type="submit">Add Event</button>

    </form>
</div>

<div id="newEvents"></div>
                <div id="ticket"></div>
        </main>
      <script src="script.js"></script>
    </body>
</html>
